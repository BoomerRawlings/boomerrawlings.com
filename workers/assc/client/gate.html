<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,noimageindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101217"><title>A quiet question</title><link rel="stylesheet" href="/ASSC/gate.css"><script src="/ASSC/gate.js" defer></script></head>
<body class="gate-body">
  <main id="gate" aria-label="A quiet question">
    <div class="gate-prompt">
      <p class="gate-riddle"><span class="gate-riddle-line">I am a hunt with no certain quarry,</span><span class="gate-riddle-line">a little wit with teeth.</span><em>What am I?</em></p>
      <form id="entry-form"><label class="gate-sr-only" for="answer">Your answer</label>
        <div class="gate-answer-line"><input id="answer" name="answer" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" maxlength="128" placeholder="Five letters." aria-describedby="feedback" required><button id="entry-submit" type="submit" aria-label="Enter"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12h25m-7-7 7 7-7 7"/></svg></button><svg class="gate-answer-wave" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 C70 10 120 10 200 10 S330 10 400 10"/></svg></div>
        <p id="feedback" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div id="gate-reveal" aria-hidden="true"></div>
    <button id="entry-retry" type="button" hidden>Continue opening <span aria-hidden="true">↗</span></button>
  </main>
  <noscript><p class="gate-no-js">JavaScript is needed to open this room.</p></noscript>
</body></html>
