[build]
  command = "npm run build"
  publish = "dist"
  # Skip production builds when a commit changes only project notes or docs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public scripts package.json package-lock.json astro.config.mjs netlify.toml tsconfig.json"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

[context.production]
  command = "npm run build"

[[redirects]]
  from = "/work/personal-archive/*"
  to = "/work/icloud-media-archive/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.boomerrawlings.com/*"
  to = "https://boomerrawlings.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
