name: Verify private observatory
on:
  push:
    paths: ['workers/observatory/**', '.github/workflows/verify-observatory.yml']
  pull_request:
    paths: ['workers/observatory/**', '.github/workflows/verify-observatory.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Verify authentication and package generic interface assets
        working-directory: workers/observatory
        run: |
          npm ci
          npm test
          npm run check
          npm run build
